<style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap");

:root {
  --ink: #1b2430;
  --muted: #5b6672;
  --line: #d9dee5;
  --accent: #2b4acb;
  --accent-tint: #eef1fb;
  --chip-bg: #f1f3f6;
}
html[data-theme="dark"] {
  --ink: #e8ebef;
  --muted: #a3acb6;
  --line: #3a434d;
  --accent: #8ea4ff;
  --accent-tint: #26304f;
  --chip-bg: #2b333c;
}

/* Type */
html body,
html body h1, html body h2, html body h3, html body h4, html body h5, html body h6,
html body button, html body input, html body textarea,
.masthead__menu-item a {
  font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
html body { color: var(--ink); }
.page__content p, .page__content li, .page__content dd { line-height: 1.7; }
.page__content a { color: var(--accent); }
.page__content a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page__content h2 { margin-top: 2.2em; }
.page__content hr { margin: 2.5rem 0; border: 0; border-top: 1px solid var(--line); }

/* Homepage hero */
.hero {
  display: grid;
  grid-template-columns: 1fr 11rem;
  gap: 2.5rem;
  align-items: center;
  margin: .5rem 0 2.5rem;
}
.hero__photo {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 14px;
  object-fit: cover;
}
.page__content .eyebrow {
  margin: 0 0 .5rem;
  color: var(--accent);
  font-size: .8rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.page__content .hero__name {
  margin: 0 0 .75rem;
  font-size: 2.5rem;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.015em;
}
.page__content .hero__text p { max-width: 40rem; margin: 0 0 .8rem; font-size: 1rem; }
.page__content .hero__text .hero__lede { font-size: 1.2rem; line-height: 1.5; color: var(--ink); }
.page__content .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.1rem; }
.page__content a.chip {
  padding: .3rem .8rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink);
  font-size: .88rem;
  font-weight: 500;
  text-decoration: none;
}
.page__content a.chip:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 700px) {
  .hero { grid-template-columns: 1fr; gap: 1.25rem; }
  .hero__photo { order: -1; max-width: 8rem; }
  .page__content .hero__name { font-size: 2.1rem; }
}

/* Section headings */
.page__content .section-title {
  margin: 3rem 0 1.25rem;
  font-size: 1.45rem;
  font-weight: 600;
  border: 0;
  scroll-margin-top: 4rem;
}
.page__content .muted { color: var(--muted); }

/* Project cards */
.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.5rem;
}
.card {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: var(--global-bg-color, #fff);
  transition: box-shadow .15s ease, transform .15s ease;
}
.card:hover { box-shadow: 0 6px 20px rgba(20, 30, 50, .08); transform: translateY(-2px); }
.card__media { display: block; border-bottom: 1px solid var(--line); }
.card__media img {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}
.card__body { padding: 1rem 1.15rem 1.15rem; }
.page__content .card p { margin: 0 0 .65rem; font-size: .95rem; line-height: 1.6; }
.page__content .card .card__meta { margin-bottom: .3rem; color: var(--muted); font-size: .8rem; }
.page__content .card h3 { margin: 0 0 .45rem; font-size: 1.15rem; line-height: 1.3; }
.page__content .card h3 a { color: var(--ink); text-decoration: none; }
.page__content .card h3 a:hover { color: var(--accent); }
.page__content .card .card__links { margin: .2rem 0 0; }
.page__content .card .card__links a { margin-right: 1rem; font-size: .9rem; font-weight: 500; }
.tag {
  display: inline-block;
  padding: .15rem .55rem;
  border-radius: 4px;
  background: var(--chip-bg);
  color: var(--muted);
  font-size: .78rem;
  font-weight: 600;
}
.tag--award { background: var(--accent-tint); color: var(--accent); }
.page__content .more { margin: 1.25rem 0 0; color: var(--muted); font-size: .95rem; }
@media (max-width: 760px) {
  .cards { grid-template-columns: 1fr; }
}

/* Experience / education timeline */
.page__content ol.timeline { margin: 0; padding: 0; list-style: none; }
.page__content ol.timeline li {
  display: grid;
  grid-template-columns: 8.5rem 1fr;
  gap: 1.25rem;
  margin: 0 0 1.1rem;
  line-height: 1.55;
}
.page__content .timeline__date { color: var(--muted); font-size: .9rem; padding-top: .1rem; }
.page__content ol.timeline .muted { font-size: .93rem; }
@media (max-width: 600px) {
  .page__content ol.timeline li { grid-template-columns: 1fr; gap: 0; }
}

/* Skills */
.page__content .skills {
  display: grid;
  grid-template-columns: minmax(9rem, 13rem) 1fr;
  gap: .8rem 1.5rem;
  align-items: baseline;
  margin: 0 0 2rem;
}
.page__content .skills dt,
.page__content .skills dd { margin: 0; padding: 0; font-size: .95rem; line-height: 1.6; }
.page__content .skills dt { font-weight: 600; }
.page__content .skills dd { display: flex; flex-wrap: wrap; gap: .35rem; }
.page__content .skills dd span {
  padding: .1rem .55rem;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: .85rem;
}
@media (max-width: 600px) {
  .page__content .skills { grid-template-columns: 1fr; gap: .3rem; }
  .page__content .skills dd { margin-bottom: .8rem; }
}

/* Projects and Research pages */
.page__content .proj-meta { margin: -.4rem 0 1rem; color: var(--muted); font-size: .95rem; }
.page__content ul.jump {
  display: flex;
  flex-wrap: wrap;
  gap: .3rem 1.4rem;
  margin: 0 0 1.5rem;
  padding: 0;
  list-style: none;
}
.page__content ul.jump li { margin: 0; }
.award {
  display: inline-block;
  padding: .35rem .75rem;
  border-left: 3px solid var(--accent);
  background: var(--accent-tint);
  font-size: .92rem;
  font-weight: 500;
}
.page__content a.btn-link {
  display: inline-block;
  margin: .25rem .5rem .25rem 0;
  padding: .4rem .85rem;
  border: 1px solid var(--accent);
  border-radius: 3px;
  color: var(--accent);
  font-size: .9rem;
  font-weight: 500;
  text-decoration: none;
}
.page__content a.btn-link:hover { background: var(--accent); color: #fff; }

/* Media */
.video-wrap { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 720px; margin: 1.5rem 0; }
.video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.page__content figure { margin: 1.25rem 0; }
.page__content figure img, .page__content figure video {
  display: block; width: 100%; max-width: 720px; height: auto; border: 1px solid var(--line);
}
.page__content figcaption { margin-top: .4rem; color: var(--muted); font-size: .85rem; }
.figure-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
  gap: 1rem;
  margin: 1.25rem 0;
}
.figure-row figure { margin: 0; }
</style>
